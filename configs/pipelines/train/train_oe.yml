exp_name: "'@{dataset.name}'_'@{network.name}'_'@{trainer.name}'_e'@{optimizer.num_epochs}'_lr'@{optimizer.lr}'_lam'@{trainer.lambda_oe}'_'@{mark}'/s'@{seed}'"

pipeline:
  name: train_oe

trainer:
  name: oe
  lambda_oe: 0.5

merge_option: default
mark: default
seed: 0
output_dir: ./results/
save_output: True
num_workers: 8
num_gpus: 1
num_machines: 1
force_merge: True

optimizer:
  num_epochs: 100
  lr: 0.1
  weight_decay: 0.0005
  momentum: 0.9
